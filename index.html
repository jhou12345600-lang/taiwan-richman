<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;font-family:"Noto Sans TC",system-ui,sans-serif;background:#0d6aa8;color:#222;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:0;border-radius:12px;font-weight:700;font-size:15px;padding:10px 14px;background:#fff;color:#222;box-shadow:0 3px 0 rgba(0,0,0,.25);transition:transform .08s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
button:disabled{opacity:.45;pointer-events:none}
.pri{background:linear-gradient(#ffd54f,#ffb300);color:#4a2c00}
.red{background:linear-gradient(#ff7043,#e53935);color:#fff}
.blue{background:linear-gradient(#4fc3f7,#0288d1);color:#fff}
.green{background:linear-gradient(#81c784,#388e3c);color:#fff}
.ghost{background:rgba(255,255,255,.85)}
input,select{font-family:inherit;font-size:16px;padding:9px 12px;border-radius:10px;border:2px solid #d0d7de;width:100%}
/* screens */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top));z-index:20;overflow:auto;touch-action:pan-y}
.panel{background:rgba(255,253,245,.97);border-radius:22px;padding:20px;width:min(520px,100%);box-shadow:0 10px 40px rgba(0,0,0,.35);max-height:100%;overflow:auto}
.logo{text-align:center;margin-bottom:6px}
.logo h1{margin:0;font-size:38px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#e53935,#fb8c00,#fdd835,#43a047,#1e88e5,#8e24aa);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 0 rgba(0,0,0,.05)}
.logo p{margin:2px 0 0;color:#666;font-size:14px}
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.skillbox{grid-column:1/-1;background:#fff;border:2px solid;border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.6}
.char{border:3px solid transparent;border-radius:14px;padding:8px 4px;text-align:center;background:#fff;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.char .e{font-size:30px}.char .n{font-size:13px;font-weight:700}
.char.sel{border-color:#ffb300;background:#fff8e1}
.char.taken{opacity:.35;pointer-events:none}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.col{display:flex;flex-direction:column;gap:10px}
.lab{font-size:13px;color:#666;font-weight:700;margin:8px 0 4px}
.seat{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:8px 10px;margin:6px 0;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.seat .e{font-size:26px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.seat .nm{flex:1;font-weight:700}.seat small{color:#888;font-weight:500}
.seat button{padding:6px 10px;font-size:13px}
.code{font-size:40px;font-weight:900;letter-spacing:8px;text-align:center;color:#0d6aa8}
.code:before{content:'房號';display:block;font-size:13px;letter-spacing:0;color:#888}
.maps{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mapc{background:#fff;border:3px solid transparent;border-radius:14px;padding:8px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.mapc.sel{border-color:#ffb300;background:#fff8e1}
.mapc .mi{font-size:26px}.mapc .mn{font-weight:900}.mapc .md{font-size:11px;color:#777;line-height:1.4}
.share{display:flex;gap:8px;align-items:center}
.share input{font-size:12px}
#qr{display:flex;justify-content:center;margin:8px 0}
#qr img,#qr canvas{width:140px;height:140px;image-rendering:pixelated}
.note{font-size:12px;color:#777;line-height:1.5}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud>*{pointer-events:auto}
#players{position:absolute;top:max(6px,env(safe-area-inset-top));left:6px;right:6px;display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pc{flex:0 0 auto;min-width:118px;background:rgba(255,255,255,.92);border-radius:14px;padding:5px 8px 5px 6px;display:flex;gap:6px;align-items:center;border:3px solid transparent;box-shadow:0 2px 8px rgba(0,0,0,.2);position:relative}
.pc.cur{border-color:#ffeb3b;box-shadow:0 0 0 2px #ff9800,0 2px 12px rgba(0,0,0,.3);transform:scale(1.03)}
.pc.out{opacity:.4;filter:grayscale(1)}
.pc .av{font-size:22px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.pc .nm{font-size:12px;font-weight:900;white-space:nowrap;max-width:84px;overflow:hidden;text-overflow:ellipsis}
.pc .cash{font-size:13px;font-weight:700;color:#2e7d32}
.pc .ic{font-size:12px;line-height:1}
.pc .off{position:absolute;right:4px;top:2px;font-size:10px;color:#e53935;font-weight:900}
#topbtn{position:absolute;right:8px;top:calc(max(6px,env(safe-area-inset-top)) + 64px);display:flex;flex-direction:column;gap:6px}
#topbtn button{width:44px;height:44px;padding:0;font-size:20px;border-radius:50%;background:rgba(255,255,255,.9)}
#roundinfo{position:absolute;left:8px;top:calc(max(6px,env(safe-area-inset-top)) + 66px);background:rgba(0,0,0,.45);color:#fff;font-size:12px;padding:4px 10px;border-radius:10px;font-weight:700}
#feed{position:absolute;left:8px;bottom:calc(118px + env(safe-area-inset-bottom));width:min(420px,72vw);display:flex;flex-direction:column;gap:3px;pointer-events:none}
#feed div{background:rgba(0,0,0,.55);color:#fff;font-size:12.5px;padding:4px 9px;border-radius:9px;width:fit-content;max-width:100%;animation:fin .3s}
@keyframes fin{from{opacity:0;transform:translateX(-10px)}}
#bar{position:absolute;left:0;right:0;bottom:0;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.45) 35%);display:flex;flex-direction:column;align-items:center;gap:6px}
#status{color:#fff;font-weight:900;text-shadow:0 2px 3px rgba(0,0,0,.6);font-size:15px;text-align:center}
#acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#acts button{min-width:88px}
#rollBtn{font-size:22px;padding:12px 26px;min-width:150px!important}
#timer{height:5px;width:min(360px,80vw);background:rgba(255,255,255,.3);border-radius:4px;overflow:hidden}
#timer i{display:block;height:100%;background:#ffeb3b;width:100%}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.modal.center{align-items:center}
.sheet{background:#fffdf5;border-radius:20px;padding:16px;width:min(520px,100%);max-height:78vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.4);animation:up .22s;touch-action:pan-y}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet h3{margin:0 0 8px;font-size:20px}
.sheet .x{float:right;padding:4px 10px;background:#eee;box-shadow:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:8px 0}
.kv b{color:#555}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.card{background:#fff;border-radius:12px;padding:8px;box-shadow:0 2px 6px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:4px}
.card .t{font-weight:900}.card .d{font-size:12px;color:#666;flex:1}
.card button{padding:6px;font-size:13px}
.stk{display:grid;grid-template-columns:1fr auto;gap:6px;background:#fff;border-radius:12px;padding:8px 10px;margin:6px 0;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.stk .bt{display:flex;gap:4px;flex-wrap:wrap;grid-column:1/3}
.stk .bt button{padding:5px 8px;font-size:12px;flex:1}
.up{color:#e53935}.dn{color:#2e7d32}
.choice{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.choice button{flex:1 1 30%}
#notice{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:25;pointer-events:none;transition:.25s;width:min(360px,86vw)}
#notice.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#notice .nb{border-radius:20px;padding:18px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.45);border:4px solid #fff}
#notice .nt{font-size:22px;font-weight:900;margin-bottom:6px}#notice .nx{font-size:17px;font-weight:700;line-height:1.5;white-space:pre-line}
.k-chance{background:linear-gradient(#fff3c4,#ffd54f)}.k-news{background:linear-gradient(#ffcdd2,#ef9a9a)}.k-god{background:linear-gradient(#fff9c4,#ffe082)}.k-evil{background:linear-gradient(#cfd8dc,#78909c);color:#fff}
#dice{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);display:flex;gap:14px;z-index:24;pointer-events:none}
.die{width:74px;height:74px;background:#fff;border-radius:16px;box-shadow:0 8px 20px rgba(0,0,0,.4),inset 0 -5px 0 #ddd;display:grid;grid-template-columns:repeat(3,1fr);padding:10px;gap:2px}
.die i{width:13px;height:13px;border-radius:50%;margin:auto;background:transparent}.die i.on{background:#222}.die.one i.on{background:#e53935;width:18px;height:18px}
.die.spin{animation:sp .15s infinite}
@keyframes sp{50%{transform:rotate(25deg) scale(1.08)}}
#xfer{position:fixed;left:50%;top:13%;transform:translate(-50%,-20px);opacity:0;z-index:26;pointer-events:none;transition:.3s;width:min(440px,92vw);display:flex;flex-direction:column;gap:6px}
#xfer.show{opacity:1;transform:translate(-50%,0)}
#xfer .xl{background:linear-gradient(135deg,#fffde7,#fff3e0);border:3px solid #ffb300;border-radius:16px;padding:8px 12px;box-shadow:0 8px 26px rgba(0,0,0,.4);text-align:center;color:#3e2723;animation:xpop .35s}
#xfer .xr{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-weight:900;font-size:17px}
#xfer .who{padding:3px 10px;border-radius:999px;color:#fff;background:var(--c);text-shadow:0 1px 2px rgba(0,0,0,.5);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
#xfer .arr{color:#e65100;font-size:15px}#xfer .amt{font-size:24px;color:#d50000}
#xfer .why{font-size:13px;font-weight:700;color:#6d4c41;margin-top:3px}#xfer .bad{color:#d50000;font-size:13px;font-weight:900}
@keyframes xpop{0%{transform:scale(.7)}70%{transform:scale(1.06)}100%{transform:scale(1)}}
#sheet .sellgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
#sheet .sellgrid button{text-align:left;padding:8px 10px;line-height:1.3}#sheet .sellgrid small{opacity:.85}
#toast{position:fixed;left:50%;top:20%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 16px;border-radius:12px;font-weight:700;z-index:40;pointer-events:none;transition:opacity .3s;opacity:0}
#emotes{position:absolute;right:60px;top:calc(max(6px,env(safe-area-inset-top)) + 64px);background:rgba(255,255,255,.95);border-radius:14px;padding:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
#emotes button{font-size:22px;padding:4px;box-shadow:none;background:transparent}
#net{position:absolute;right:8px;bottom:calc(118px + env(safe-area-inset-bottom));font-size:11px;color:#fff;background:rgba(0,0,0,.4);padding:3px 8px;border-radius:8px}
.rank{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:#fff;margin:6px 0;font-weight:700}
.rank .m{font-size:26px;width:34px;text-align:center}
.iosStep{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:12px;padding:10px;margin:8px 0;box-shadow:0 1px 4px rgba(0,0,0,.08);font-size:15px;line-height:1.5}
.iosStep>span{flex:0 0 28px;height:28px;border-radius:50%;background:#ffb300;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center}
.iosStep .ico{font-size:18px}
#iosArrow{position:fixed;left:50%;bottom:calc(6px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:44px;z-index:60;animation:bob 1s infinite;pointer-events:none}
@keyframes bob{50%{transform:translate(-50%,10px)}}
.pwa #fsBtn,.pwa #fsHomeBtn{display:none}
#hud{padding-top:env(safe-area-inset-top)}
#awayBox{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:28;display:flex;align-items:center;justify-content:center;padding:16px}
#awayBox .ab{background:#fffdf5;border-radius:20px;padding:20px;width:min(340px,100%);text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4)}
@media (max-height:520px){#topbtn{flex-direction:row;flex-wrap:wrap;width:100px;gap:4px}#topbtn button{width:44px;height:36px;font-size:17px;border-radius:10px}#emotes{right:116px}}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:700;z-index:50;background:#0d6aa8}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="loading" id="loading">🏝️ 正在建造寶島…</div>

<!-- 首頁 -->
<div class="screen hidden" id="home">
  <div class="panel">
    <div class="logo"><h1>寶島富翁 3D</h1><p>大富翁6玩法・4 張台灣地圖・2–6 人連線</p></div>
    <div class="lab">你的暱稱</div>
    <input id="nameIn" maxlength="8" placeholder="輸入暱稱">
    <div class="lab">自訂頭像（選填，會顯示在角色頭上）</div>
    <div class="row" style="align-items:center"><span id="avPrev" style="flex:0 0 auto"></span><label class="ghost" style="flex:1;text-align:center;background:#fff;border-radius:12px;padding:9px;box-shadow:0 3px 0 rgba(0,0,0,.25);font-weight:700;cursor:pointer">📷 上傳圖片<input type="file" id="avFile" accept="image/*" style="display:none"></label><button class="ghost" id="avClear" style="flex:0 0 auto">清除</button></div>
    <div class="lab">選擇角色</div>
    <div class="chars" id="charPick"></div>
    <div class="col">
      <button class="pri hidden" id="joinBtn" style="font-size:18px">🚪 加入房間</button>
      <button class="pri" id="createBtn" style="font-size:18px">🌐 建立連線房間</button>
      <div id="codeRow" style="background:#e3f2fd;border-radius:14px;padding:10px">
        <div class="lab" style="margin-top:0">🔢 朋友開好房間了？輸入房號加入</div>
        <div class="row"><input id="codeIn" maxlength="6" inputmode="numeric" pattern="[0-9]*" placeholder="例如 382915" style="font-size:22px;letter-spacing:4px;text-align:center"><button class="blue" id="codeBtn" style="flex:0 0 auto;font-size:17px">加入</button></div>
      </div>
      <button class="green hidden" id="lastBtn"></button>
      <button class="ghost" id="pasteBtn">📋 貼上邀請連結加入</button>
      <button class="ghost" id="soloBtn">🤖 單機遊戲（跟電腦 / 同一台輪流玩）</button>
      <button class="ghost" id="fsHomeBtn">⛶ 全螢幕</button>
    </div>
    <p class="note" id="homeMsg"></p>
    <p class="note">玩法：擲骰子環島，買下景點、蓋房子收過路費；用點券買道具卡整人，神明附身、股市、銀行、機會與新聞事件，讓對手全部破產或回合結束時資產最多的人獲勝！</p>
  </div>
</div>

<!-- 等待室 -->
<div class="screen hidden" id="lobby">
  <div class="panel">
    <div class="logo"><h1 style="font-size:26px">等待室</h1></div>
    <div id="roomBox">
      <div class="code" id="roomCode"></div>

<script type="module">
// src/data.js

function setupMinigame(pid) {
  const box = $("#mg");
  let score = 0, running = false;
  $("#mgStart").onclick = () => {
    if (running) return;
    running = true;
    $("#mgStart").disabled = true;
    const end = Date.now() + 1e4;
    const spawn = setInterval(() => {
      if (Date.now() > end) return;
      const bomb = Math.random() < 0.18;
      const c = document.createElement("div");
      c.textContent = bomb ? "💣" : "🪙";
      c.style.cssText = `position:absolute;left:${Math.random() * 85}%;top:-40px;font-size:34px;cursor:pointer;user-select:none;transition:top ${1.6 + Math.random()}s linear`;
      box.appendChild(c);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        c.style.top = "320px";
      }));
      const hit = (e) => {
        e.preventDefault();
        if (c.dataset.done) return;
        c.dataset.done = 1;
        score = Math.max(0, score + (bomb ? -5 : 1));
        $("#mgScore").textContent = score + " 枚";
        beep(bomb ? "pay" : "coin");
        c.style.transform = "scale(1.6)";
        c.style.opacity = 0;
      };
      c.addEventListener("pointerdown", hit);
      setTimeout(() => c.remove(), 3e3);
    }, 260);
    const t = setInterval(() => {
      const left = Math.max(0, Math.ceil((end - Date.now()) / 1e3));
      $("#mgStart").textContent = left + " 秒";
      if (Date.now() > end) {
        clearInterval(t);
        clearInterval(spawn);
        setTimeout(() => {
          send(pid, { type: "mg", score });
          closeSheet();
        }, 600);
      }
    }, 200);
  };
}

  <p class="note">回來的方法：打開同一個網址，或在首頁輸入房號，系統會把你放回原本的座位。</p>`);
document.addEventListener("click", (e) => {
  if (e.target.id === "awayStay") setAway(true);
  if (e.target.id === "awayHome") {
    setAway(true);
    LS.set("tr3d-lastroom", { r: G.s.room, b: G.bi, t: Date.now() });
    setTimeout(() => {
      location.href = location.pathname;
    }, 600);
  }
  if (e.target.id === "awayBack") setAway(false);
});
$("#camBtn").onclick = () => {
  if (world.follow) {
    world.overview();
    toast("全島視角");
  } else {
    world.zoomIn();
    toast("跟隨目前玩家");
  }
};
$("#stockBtn").onclick = () => openStock();
$("#logBtn").onclick = () => {
  if (!G.s) return;
  openSheet(`<button class="x" data-close>✕</button><h3>📜 遊戲紀錄</h3><div class="note" style="font-size:13px;color:#333">${G.s.log.slice().reverse().map(esc).join("<br>")}</div>`);
};
$("#emoBtn").onclick = () => $("#emotes").classList.toggle("hidden");
var Q_NAME = { high: "高畫質", std: "標準", saver: "省電模式" };
var Q_DESC = { high: "畫面最細緻、最流暢，比較耗電", std: "畫質與耗電平衡（手機預設）", saver: "降低解析度、關閉陰影、降低更新率，最省電不發燙" };
function qIcon() {
  $("#qBtn").textContent = world.quality === "saver" ? "🔋" : world.quality === "high" ? "✨" : "⚡";
}
$("#qBtn").onclick = () => {
  const order = ["high", "std", "saver"], q = order[(order.indexOf(world.quality) + 1) % 3];
  world.setQuality(q);
  qIcon();
  toast(`${Q_NAME[q]}：${Q_DESC[q]}`);
};
qIcon();
$("#sndBtn").onclick = () => {
  G.sound = !G.sound;
  LS.set("tr3d-snd", G.sound);
  $("#sndBtn").textContent = G.sound ? "🔊" : "🔇";
};
$("#sndBtn").textContent = G.sound ? "🔊" : "🔇";
$("#helpBtn").onclick = () => openSheet(`<button class="x" data-close>✕</button><h3>❔ 玩法說明</h3><div class="note" style="font-size:14px;color:#333">
  <p>🎲 輪到你時先可以用道具卡、買賣股票，再擲骰子前進。</p>
  <p>🏠 停在無人景點可以買下；停在自己的地可以加蓋，最高蓋到摩天大樓。別人停到你的地要付過路費；自己的地連在一起會「連鎖」，過路費整串加總（大富翁6規則）。</p>
  <p>🎲 預設 1 顆骰子，到🛵車行買機車（2 顆）、汽車（3 顆）。一輪是一天，月曆會走動。</p>
  <p>🏢 投資公司：別人停下要付「骰子點數 × $200 × 你的公司數」。🏗️ 大型建地：可蓋主題公園、加油站、研究所、購物中心、度假飯店、遊樂園，再停到可以擴建到 3 級。</p>
  <p>🏦 經過或停在銀行後，下次擲骰前可以按「銀行」存提款。買完地可以按「⏭ 換下一位」馬上換人。</p>
  <p>🔨 有人放棄買地時，其他玩家可以出價拍賣。🎰 樂透每 7 天開獎、沒人中就累積。🕹️ 小遊戲接金幣賺點券。🔮魔法屋、👼天使、😈惡魔隨機出現。</p>
  <p>🚉 經過台北車站領環島獎金 $1000、點券 +10；經過或停在🏦銀行可以存提款，每月 1 日發存款利息 10%。</p>
  <p>🏪 道具店用點券買卡；⛩️ 廟會請到神明附身 5 回合（財神、福神、土地公、媽祖是好神，衰神、窮神是壞神）。</p>
  <p>❓ 機會、📰 新聞會發生隨機事件；🏦 銀行可存提款；🎰 彩券行猜點數。</p>
  <p>💸 付不出錢會自動提款、賣股票、賣地，還不夠就破產。最後只剩一人、或回合結束時總資產最多的人獲勝！</p>
  <p>📶 斷線的玩家會由電腦暫時託管；重新打開同一個網址就能回到座位。房主斷線太久，會由其他玩家自動接手。</p>
  <p>👆 點地圖上的格子可以看景點介紹和過路費；兩指縮放、拖曳旋轉視角。</p></div>`);
(async function boot() {
  if (G.room) {
    const saved = LS.get("tr3d-save-" + G.room, null);
    const seat = LS.get("tr3d-seat-" + G.room, null);
    if (saved && saved.s && saved.s.host === seat && seat !== myId && Date.now() - saved.t < 6 * 36e5) {
      $("#homeMsg").textContent = "正在恢復房間…";
      G.probe = true;
      try {
        await connectNet();
      } catch (e) {
        $("#homeMsg").textContent = "❌ 連線失敗，請重新整理。";
        return;
      }
      G.net.pub("hi", { from: "probe-" + myId, t: "hello" });
      await new Promise((r) => setTimeout(r, G.localMode ? 1200 : 3500));
      G.probe = false;
      if (G.seen[seat] && Date.now() - G.seen[seat] < 6e3) {
        $("#homeMsg").textContent = "";
        G.net.pub("hi", { from: myId, t: "hello" });
        return;
      }
      myId = seat;
      SS.set("tr3d-sid", myId);
      G.s = saved.s;
      becomeHost(false);
      G.s.v += 500;
      if (G.s.step === "move") G.s.until = Date.now();
      if (G.s.phase === "play") {
        G.s.deadline = Date.now() + PRE_T;
      }
      publish(true);
      if (G.s.phase === "lobby") enterLobby();
      return;
    }
    if (saved && saved.s && saved.s.host === seat && seat === myId) {
      try {
        await connectNet();
      } catch (e) {
        $("#homeMsg").textContent = "❌ 連線失敗，請重新整理。";
        return;
      }
      G.s = saved.s;
      becomeHost(false);
      G.s.v += 500;
      if (G.s.step === "move") G.s.until = Date.now();
      if (G.s.phase === "play") G.s.deadline = Date.now() + PRE_T;
      publish(true);
      if (G.s.phase === "lobby") enterLobby();
      return;
    }
    if (seat) {
      try {
        await connectNet();
        G.net.pub("hi", { from: myId, t: "hello" });
      } catch (e) {
      }
    }
  }
})();
window.__G = G;
window.__world = world;
window.__pickTile = (i) => onTileClick(i);

</script>
